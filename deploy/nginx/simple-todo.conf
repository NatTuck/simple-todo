server {
    listen 80;
    listen [::]:80;
    server_name simple-todo.ironbeard.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name simple-todo.ironbeard.com;

    ssl_certificate /etc/letsencrypt/live/simple-todo.ironbeard.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simple-todo.ironbeard.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/simple-todo;
    index index.html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }
}
